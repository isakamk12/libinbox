<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CENTRAL LIBRARY - CENTRAL BANK</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/bank.css">
</head>
<body class="bank-theme">

  <header id="main-header">
    <div class="logo">
      <h1 class="lib-title">CENTRAL LIBRARY</h1>
      <span class="lib-subtitle">夢見ヶ丘中央図書館 ポータル</span>
    </div>
    <nav aria-label="メインナビゲーション">
      <ul class="nav-links">
        <li><a href="#vault-section" id="nav-bank">The Grand Vault</a></li>
      </ul>
    </nav>
    <div id="theme-switcher-container"></div>
  </header>

  <section class="hero bank-hero" id="home-hero">
    <div class="hero-content">
      <h2 class="hero-title" style="font-family: 'Cinzel Decorative', serif; font-size: 4rem; letter-spacing: 5px;">CENTRAL BANK</h2>
      <p class="hero-subtitle" style="font-family: 'Noto Serif JP', serif;">確かな信頼と重厚なる金庫室</p>
    </div>
  </section>

  <section id="vault-section" class="catalog-section">
    <div class="section-title" style="position: relative; z-index: 10;">
      <h2 style="font-family: 'Cinzel Decorative', serif;">The Grand Vault</h2>
      <p style="text-align: center; font-family: 'Noto Serif JP', serif;">貴重な知を預かる大金庫。</p>
    </div>
    <div class="bank-container" id="bank-container">
      <!-- 固有の演出領域 -->
    </div>
  </section>

  <footer id="main-footer">
    <div class="copyright">
      <p>&copy; 2026 Central Library - CENTRAL BANK Division. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/bank.js"></script>
  <script src="js/components.js"></script>
</body>
</html>
