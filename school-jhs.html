<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CENTRAL LIBRARY - JUNIOR HIGH</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
  
  <!-- CSS -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/school-jhs.css">
</head>
<body class="jhs-theme">

  <!-- Header Section -->
  <header id="main-header">
    <div class="logo">
      <h1 class="lib-title" style="font-family: 'Oswald', sans-serif; letter-spacing: 2px;">YUMEMIGAOKA J.H.S</h1>
      <span class="lib-subtitle" style="font-family: 'M PLUS Rounded 1c', sans-serif;">夢見ヶ丘中央図書館 中学校エリア</span>
    </div>
    
    <nav aria-label="メインナビゲーション">
      <ul class="nav-links">
        <li><a href="#club-room-section" id="nav-club">The Club Room</a></li>
      </ul>
    </nav>

    <div id="theme-switcher-container"></div>
  </header>

  <!-- Hero Section -->
  <section class="hero jhs-hero" id="home-hero">
    <div class="hero-content">
      <h2 class="hero-title" style="font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 5rem; letter-spacing: 5px; color: #fff;">ADOLESCENCE</h2>
      <p class="hero-subtitle" style="font-family: 'M PLUS Rounded 1c', sans-serif; color: #bdc3c7; letter-spacing: 2px;">少し背伸びした、青の時代。</p>
    </div>
  </section>

  <!-- 🎒 Club Room (Locker) Section -->
  <section id="club-room-section" class="catalog-section" style="background-color: #2c3e50; padding: 4rem 0;">
    <div class="section-title">
      <h2 style="color: #ecf0f1; font-family: 'M PLUS Rounded 1c', sans-serif; border-bottom: 2px solid #3498db; display: inline-block; padding-bottom: 10px;">The Lockers</h2>
      <p style="text-align: center; color: #95a5a6; font-family: 'M PLUS Rounded 1c', sans-serif; margin-top: 15px;">ロッカーの中に隠された情報へアクセスしてください。</p>
    </div>
    
    <div class="locker-room" id="locker-room">
      <!-- JSでロッカーが生成されます -->
    </div>

  </section>

  <!-- Footer Section -->
  <footer id="main-footer" style="background-color: #1a252f; border-top: 2px solid #2980b9;">
    <div class="copyright">
      <p style="font-family: 'Oswald', sans-serif; color: #7f8c8d;">&copy; 2026 Central Library - Junior High School Area.</p>
    </div>
  </footer>

  <script src="js/school-jhs.js"></script>
<script src="js/components.js"></script>
</body>
</html>
