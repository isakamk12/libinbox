<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CENTRAL LIBRARY - TERMINAL STATION</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/station.css">
</head>
<body class="station-theme">

  <header id="main-header">
    <div class="logo">
      <h1 class="lib-title">CENTRAL LIBRARY</h1>
      <span class="lib-subtitle">夢見ヶ丘中央図書館 ポータル</span>
    </div>
    <nav aria-label="メインナビゲーション">
      <ul class="nav-links">
        <li><a href="#platform-section" id="nav-station">Platform 9 3/4</a></li>
      </ul>
    </nav>
    <div id="theme-switcher-container"></div>
  </header>

  <section class="hero station-hero" id="home-hero">
    <div class="hero-content">
      <h2 class="hero-title" style="font-family: 'Oswald', serif; font-size: 4rem; letter-spacing: 5px;">TERMINAL STATION</h2>
      <p class="hero-subtitle" style="font-family: 'Noto Serif JP', serif;">無限に広がる路線の交差点</p>
    </div>
  </section>

  <section id="platform-section" class="catalog-section">
    <div class="section-title" style="position: relative; z-index: 10;">
      <h2 style="font-family: 'Oswald', serif;">Platform 9 3/4</h2>
      <p style="text-align: center; font-family: 'Noto Serif JP', serif;">次の列車がまもなく到着します。</p>
    </div>
    <div class="station-container" id="station-container">
      <!-- 固有の演出領域 -->
    </div>
  </section>

  <footer id="main-footer">
    <div class="copyright">
      <p>&copy; 2026 Central Library - TERMINAL STATION Division. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/station.js"></script>
  <script src="js/components.js"></script>
</body>
</html>
