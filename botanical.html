<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CENTRAL LIBRARY - BOTANICAL GARDEN</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/botanical.css">
</head>
<body class="botanical-theme">

  <header id="main-header">
    <div class="logo">
      <h1 class="lib-title">CENTRAL LIBRARY</h1>
      <span class="lib-subtitle">夢見ヶ丘中央図書館 ポータル</span>
    </div>
    <nav aria-label="メインナビゲーション">
      <ul class="nav-links">
        <li><a href="#greenhouse-section" id="nav-botanical">The Glasshouse</a></li>
      </ul>
    </nav>
    <div id="theme-switcher-container"></div>
  </header>

  <section class="hero botanical-hero" id="home-hero">
    <div class="hero-content">
      <h2 class="hero-title" style="font-family: 'Cormorant Garamond', serif; font-size: 4rem; letter-spacing: 5px;">BOTANICAL GARDEN</h2>
      <p class="hero-subtitle" style="font-family: 'Noto Serif JP', serif;">緑と光のサンクチュアリ</p>
    </div>
  </section>

  <section id="greenhouse-section" class="catalog-section">
    <div class="section-title" style="position: relative; z-index: 10;">
      <h2 style="font-family: 'Cormorant Garamond', serif;">The Glasshouse</h2>
      <p style="text-align: center; font-family: 'Noto Serif JP', serif;">植物が息づくガラスの空間。</p>
    </div>
    <div class="botanical-container" id="botanical-container">
      <!-- 固有の演出領域 -->
    </div>
  </section>

  <footer id="main-footer">
    <div class="copyright">
      <p>&copy; 2026 Central Library - BOTANICAL GARDEN Division. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/botanical.js"></script>
  <script src="js/components.js"></script>
</body>
</html>
