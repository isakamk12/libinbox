<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CENTRAL LIBRARY - NATURAL HISTORY MUSEUM</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- CSS -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/museum.css">
</head>
<body class="museum-theme">

  <!-- Header Section -->
  <header id="main-header">
    <div class="logo">
      <h1 class="lib-title">CENTRAL LIBRARY</h1>
      <span class="lib-subtitle">夢見ヶ丘中央図書館 ポータル</span>
    </div>
    
    <nav aria-label="メインナビゲーション">
      <ul class="nav-links">
        <li><a href="#showcase-section" id="nav-showcase">標本展示室</a></li>
        <li><a href="#excavation-section" id="nav-excavation">発掘サイト</a></li>
      </ul>
    </nav>

    <div id="theme-switcher-container"></div>
  </header>

  <!-- Hero Section -->
  <section class="hero museum-hero" id="home-hero">
    <div class="hero-content">
      <h2 class="hero-title" style="font-family: 'Cinzel', serif; font-size: 3.5rem; letter-spacing: 4px;">NATURAL HISTORY MUSEUM</h2>
      <p class="hero-subtitle" style="font-family: 'Noto Serif JP', serif;">発見と観察の空間</p>
    </div>
  </section>

  <!-- 🏛️ Section 1: The Glass Showcase -->
  <section id="showcase-section" class="catalog-section" style="background-color: #1a1a1a; padding: 6rem 2rem;">
    <div class="section-title">
      <h2 style="color: #d4af37; font-family: 'Cinzel', serif;">The Glass Showcase</h2>
      <p style="text-align: center; color: #aaa; font-family: 'Noto Serif JP', serif;">ガラスケースに収められた遺物。マウスの動きでガラスの反射が変わり、多角的に観察できます。</p>
    </div>
    
    <div class="showcase-hall" id="showcase-hall">
      <!-- JSでショーケースが生成されます -->
    </div>
  </section>

  <!-- ⛏️ Section 2: The Excavation Layer -->
  <section id="excavation-section" class="catalog-section" style="background-color: #2c211b; padding: 6rem 2rem; position: relative;">
    <div class="section-title">
      <h2 style="color: #e67e22; font-family: 'Cinzel', serif;">The Excavation Site</h2>
      <p style="text-align: center; color: #dcdde1; font-family: 'Noto Serif JP', serif;">マウスで砂を削り取り（ドラッグ/こする）、隠された化石を発掘してください。</p>
    </div>

    <div class="excavation-site" id="excavation-site">
      <!-- 発掘対象のコンテナ -->
      <div class="excavation-pit">
        <!-- 発掘される中身（化石画像などを想定） -->
        <div class="fossil-item" style="background-color: #eee; color: #333; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-family: 'Cinzel', serif;">
          T-REX SKULL
        </div>
        <!-- 削り取る砂のレイヤー（Canvas） -->
        <canvas id="sand-canvas" class="sand-layer"></canvas>
      </div>
      
      <div style="text-align: center; margin-top: 2rem;">
        <button id="reset-excavation" class="theme-btn" style="background: transparent; border: 1px solid #e67e22; color: #e67e22; cursor: pointer;">もう一度埋める</button>
      </div>
    </div>
  </section>

  <!-- Footer Section -->
  <footer id="main-footer" style="background-color: #111; color: #666;">
    <div class="copyright">
      <p>&copy; 2026 Central Library - Museum Division. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/museum.js"></script>
<script src="js/components.js"></script>
</body>
</html>
